# Recommended nginx site config for shaar.ps
# Point the site root to Laravel's public folder only.

server {
    listen 80;
    listen [::]:80;
    server_name shaar.ps www.shaar.ps;

    root /var/www/html/public;
    index index.php;

    location ~ /\. {
        deny all;
        access_log off;
        log_not_found off;
    }

    location ~* \.(env|git|gitignore|sql|log)$ {
        deny all;
    }

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location ~ \.php$ {
        include snippets/fastcgi-php.conf;
        fastcgi_pass unix:/run/php/php8.1-fpm.sock;
    }
}
